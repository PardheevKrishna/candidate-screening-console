[theme]
base = "light"
primaryColor = "#D71E28"
backgroundColor = "#F9F9F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
font = "sans serif"

[server]
# Bulk resume uploads (ZIPs of ~3,000 PDFs) can be large; size in MB. A reverse proxy in
# front of the app needs a request-body limit at least this large (docs/DEPLOYMENT.md).
maxUploadSize = 1024
# Security defaults, set explicitly so they are not switched off by accident: XSRF tokens
# on file uploads, and origin checks on the browser connection.
enableXsrfProtection = true
enableCORS = true
# Port, listen address, headless mode and file watching are set per machine by
# scripts/run_app.ps1 / scripts/run_app.sh or by STREAMLIT_* environment variables, so this
# file stays the same on every machine. See docs/DEPLOYMENT.md ("Configuration").

[browser]
# Never send usage statistics.
gatherUsageStats = false
